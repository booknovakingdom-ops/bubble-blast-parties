<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thanks! | Bubble Blast Parties</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://bubbleblastparties.ca/thanks.html">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<meta name="theme-color" content="#0aa5d8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4fbff;--ink:#0e2a3b;--muted:#46606f;--brand:#0aa5d8;--brand-d:#0780a8;--pop:#ff4f9a;--card:#fff;--line:#d5e7f0;--font-head:'Baloo 2',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#07202e;--ink:#eaf6fc;--muted:#a6c0cd;--card:#0c2e40;--line:#1b4a63}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:16px/1.6 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);text-align:center;padding:24px}
.card{max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 28px}
.emoji{font-size:48px;display:block;margin-bottom:14px}
h1{font-family:var(--font-head);font-weight:800;font-size:28px;margin:0 0 12px}
p{color:var(--muted);margin:0 0 24px}
.btn{display:inline-block;background:var(--pop);color:#fff;text-decoration:none;font-weight:700;padding:13px 24px;border-radius:999px;font-family:var(--font-head);margin:4px}
.btn.alt{background:transparent;color:var(--brand-d);border:2px solid var(--brand)}
</style>
</head>
<body>
<div class="card">
<span class="emoji">&#127881;</span>
<h1>Got it, thanks!</h1>
<p>Your quote request is in. We'll be in touch soon &mdash; if it's urgent, just give us a call.</p>
<a class="btn" href="tel:+19029900005">Call 902-990-0005</a>
<a class="btn alt" href="/">Back to the site</a>
</div>
</body>
</html>
